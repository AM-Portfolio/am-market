# PostgreSQL Configuration
# POSTGRES_PASSWORD: password
# POSTGRES_USERNAME: postgres
# POSTGRES_URL: jdbc:postgresql://localhost:5456
# POSTGRES_DATABASE: portfolio
INFRA_HOST: ${INFRA_HOST:localhost}
#mongoDB Configuration
MONGODB_DATABASE_NAME: ${MONGODB_DATABASE:market_data}
MONGODB_USERNAME_INTERNAL: ${MONGODB_USERNAME:admin}
MONGODB_PASSWORD_INTERNAL: ${MONGODB_PASSWORD:password123}

# InfluxDB Configuration
INFLUXDB_TOKEN_INTERNAL: ${INFLUXDB_TOKEN:my-super-secret-auth-token}
INFLUXDB_ORG_INTERNAL: ${INFLUXDB_ORG:am-portfolio}
INFLUXDB_BUCKET_INTERNAL: ${INFLUXDB_BUCKET:market-data}
INFLUXDB_URL_INTERNAL: http://${INFRA_HOST}:8086

# Redis Configuration
REDIS_HOSTNAME: ${INFRA_HOST}
REDIS_PASSWORD_INTERNAL: ${REDIS_PASSWORD:password123}
REDIS_PORT: 6379

# Grafana Configuration
GRAFANA_ADMIN_USER: 1109403
GRAFANA_ADMIN_PASSWORD: XXXXXXXXXX

# Application Configuration
STOKUPATE_TOPIC_NAME: am-stock-price-update
NSE_INDICES_TOPIC_NAME: nse-indices-update
NSE_STOCK_INDICES_TOPIC_NAME: nse-stock-indices-update
BOARD_OF_DIRECTORS_TOPIC_NAME: stock-board-of-directors
QUATERLY_FINANCIALS_TOPIC_NAME: stock-quaterly-financials
STOCK_RESULTS_FINANCIALS_TOPIC_NAME: stock-results-financials
STOCK_PROFIT_AND_LOSS_FINANCIALS_TOPIC_NAME: stock-profit-and-loss-financials
STOCK_BALANCE_SHEET_FINANCIALS_TOPIC_NAME: stock-balance-sheet-financials
STOCK_CASH_FLOW_FINANCIALS_TOPIC_NAME: stock-cash-flow-financials
STOCK_FACT_SHEET_DIVIDEND_FINANCIALS_TOPIC_NAME: stock-fact-sheet-dividend-financials

MARKET_DATA_MAX_RETRIES: 3
MARKET_DATA_RETRY_DELAY_MS: 1000
MARKET_DATA_THREAD_POOL_SIZE: 5
MARKET_DATA_THREAD_QUEUE_CAPACITY: 10
MARKET_DATA_MAX_AGE_MINUTES: 15

# Upstox Configuration
UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN}
UPSTOX_SECRET_KEY: ${UPSTOX_SECRET_KEY}
UPSTOX_CODE: ${UPSTOX_CODE}
MARKET_DATA_KAFKA_ENABLED: ${MARKET_DATA_KAFKA_ENABLED:false}

app:
  kafka:
    enabled: ${MARKET_DATA_KAFKA_ENABLED:false}

kafka:
  topics:
    stock-price: am-stock-price-update

spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  application:
    name: market-data-service
  data:
    redis:
      host: ${REDIS_HOSTNAME}
      password: ${REDIS_PASSWORD_INTERNAL}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URL:mongodb://${MONGODB_USERNAME_INTERNAL}:${MONGODB_PASSWORD_INTERNAL}@${INFRA_HOST}:27017/market_data?authSource=admin}
      database: ${MONGODB_DATABASE_NAME}
      username: ${MONGODB_USERNAME_INTERNAL}
      password: ${MONGODB_PASSWORD_INTERNAL}
      authentication-database: admin

  # Multipart file upload configuration (for bulk security updates)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB # Maximum file size (CSV/Excel files)
      max-request-size: 10MB # Maximum request size
      file-size-threshold: 2KB # Threshold for writing to disk

  # InfluxDB Configuration
  influx:
    url: ${INFLUXDB_URL_INTERNAL}
    token: ${INFLUXDB_TOKEN_INTERNAL}
    org: ${INFLUXDB_ORG_INTERNAL}
    bucket: ${INFLUXDB_BUCKET_INTERNAL}

  # Management and Metrics Configuration

  config:
    import:
      - classpath:isin.yml
      - classpath:nseindices.yml
      #- classpath:application-external-api.yml
      #- classpath:application-endpoints.yml
      - classpath:application-zerodha.yml

market-data:
  provider: upstox
  batch-search:
    max-queries: ${BATCH_SEARCH_MAX_QUERIES:1000}
    internal-batch-size: ${BATCH_SEARCH_INTERNAL_BATCH_SIZE:100}
    mongo-query-limit: ${BATCH_SEARCH_MONGO_QUERY_LIMIT:0}
    max-candidates-per-query: ${BATCH_SEARCH_MAX_CANDIDATES:100}
    cache-enabled: ${BATCH_SEARCH_CACHE_ENABLED:true}
  stream:
    poll-interval-seconds: ${MARKET_DATA_POLL_INTERVAL_SECONDS:10}
    mock-poll-interval-seconds: ${MARKET_DATA_MOCK_POLL_INTERVAL_SECONDS:5}
  cache:
    enabled: true
    price-ttl-minutes: ${MARKET_DATA_CACHE_PRICE_TTL_MINUTES:15}
    history-ttl-minutes: ${MARKET_HISTORY_DATA_CACHE_HISTORY_TTL_MINUTES:15}
# Logging Configuration
logging:
  file:
    name: ./logs/market-data-app.log # Log file in current directory
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: false
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%class{0}.%method] - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%class{0}.%method] - %msg%n"
  level:
    root: WARN
    "[com.am.marketdata]": INFO
    "[com.am.marketdata.scheduler]": INFO
    "[com.am.marketdata.service]": INFO
    "[com.am.marketdata.redis]": INFO
    "[com.am.marketdata.external.api]": WARN
    "[com.am.common.investment.service]": INFO
    "[org.springframework]": WARN
    "[org.apache.kafka]": INFO
    "[org.springframework.data.redis]": WARN # Reduce Redis connection logging

upstox:
  interval: I1
  auth:
    base-url: https://api.upstox.com/v2
    code: ${UPSTOX_CODE}
    api-key: ${UPSTOX_API_KEY}
    secret-key: ${UPSTOX_SECRET_KEY}
    access-token: ${UPSTOX_ACCESS_TOKEN}
    redirect-uri: ${UPSTOX_REDIRECT_URI:http://localhost:${server.port}/v1/market-data/auth/session}
    authorization-url: https://api-v2.upstox.com/login/authorization/dialog
    token-url: https://api-v2.upstox.com/login/authorization/token
    token-refresh-interval: 3600000
    scope: orders feed portfolio

scraper:
  urls:
    - https://www.nseindia.com/

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

scheduler:
  timezone: ${SCHEDULER_TIMEZONE:Asia/Kolkata}
  # ── Cookie / NSE session ──────────────────────────────────────────────────
  cookie:
    enabled: ${SCHEDULER_COOKIE_ENABLED:true}
    refresh: ${SCHEDULER_COOKIE_REFRESH_CRON:"0 0 9-16 * * MON-FRI"}
  # ── Stock-indices ─────────────────────────────────────────────────────────
  stock-indices:
    enabled: ${SCHEDULER_STOCK_INDICES_ENABLED:true}
    morning-fetch: ${SCHEDULER_STOCK_INDICES_MORNING_FETCH_CRON:"0 30 9 * * *"}
    evening-fetch: ${SCHEDULER_STOCK_INDICES_EVENING_FETCH_CRON:"0 0 16 * * *"}
    retry:
      cron: ${SCHEDULER_STOCK_INDICES_RETRY_CRON:"0 */15 * * * *"}
      interval-minutes: ${SCHEDULER_STOCK_INDICES_RETRY_INTERVAL_MINUTES:15}
      max-retries: ${SCHEDULER_STOCK_INDICES_RETRY_MAX_RETRIES:20}
  # ── Intra-day indices fetch ───────────────────────────────────────────────
  indices:
    fetch: ${SCHEDULER_INDICES_FETCH_CRON:"0 */2 * * * *"}
  # ── Ingestion (live market-hours) ─────────────────────────────────────────
  ingestion:
    enabled: ${SCHEDULER_INGESTION_ENABLED:true}
    provider: ${SCHEDULER_INGESTION_PROVIDER:UPSTOX}
    force: ${SCHEDULER_INGESTION_FORCE:true}
    symbols: ${SCHEDULER_INGESTION_SYMBOLS:"NIFTY 50,NIFTY BANK"}
    start-cron: ${SCHEDULER_INGESTION_START_CRON:"0 15 9 * * MON-FRI"}   # 9:15 AM weekdays
    stop-cron: ${SCHEDULER_INGESTION_STOP_CRON:"0 30 15 * * MON-FRI"}    # 3:30 PM weekdays
  # ── Market window (used by MarketDataIngestionScheduler) ──────────────────
  market:
    start: ${SCHEDULER_MARKET_START:09:15}
    end: ${SCHEDULER_MARKET_END:15:30}
  # ── Historical sync ───────────────────────────────────────────────────────
  historical:
    sync-cron: ${SCHEDULER_HISTORICAL_SYNC_CRON:"0 15 7 * * *"}          # 7:15 AM daily
  # ── Analysis ─────────────────────────────────────────────────────────────
  analysis:
    daily: ${SCHEDULER_ANALYSIS_DAILY_CRON:"0 15 7 * * *"}               # 7:15 AM daily
  # ── Stream start/stop ─────────────────────────────────────────────────────
  stream:
    start-cron: ${SCHEDULER_STREAM_START_CRON:"0 0 9 ? * MON-FRI"}
    stop-cron: ${SCHEDULER_STREAM_STOP_CRON:"0 30 15 ? * MON-FRI"}
  # ── Redis cleanup ─────────────────────────────────────────────────────────
  redis:
    cleanup:
      enabled: ${SCHEDULER_REDIS_CLEANUP_ENABLED:true}
      cron: ${SCHEDULER_REDIS_CLEANUP_CRON:"0 0 2 * * *"}                # 2:00 AM daily

redis:
  cleanup:
    retention:
      days: ${REDIS_CLEANUP_RETENTION_DAYS:7}       # Keep last N days in Redis
    batch:
      size: ${REDIS_CLEANUP_BATCH_SIZE:1000}         # Process N keys at a time
  cache:
    ttl:
      historical: ${REDIS_CACHE_TTL_HISTORICAL:2592000}         # 30 days
      analysis: ${REDIS_CACHE_TTL_ANALYSIS:2592000}             # 30 days for historical analysis data
      intraday:
        past: ${REDIS_CACHE_TTL_INTRADAY_PAST:14400}            # 4 hours for past dates
        future: ${REDIS_CACHE_TTL_INTRADAY_FUTURE:86400}        # 24 hours for future dates
        buffer: ${REDIS_CACHE_TTL_INTRADAY_BUFFER:14400}        # 4 hour buffer after EOD

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      validate-group-membership: false
      group:
        readiness:
          include: diskSpace,mongodb,redis,kafka,influx
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongodb:
      enabled: true
    redis:
      enabled: true

    influxdb:
      enabled: true

jwt:
  secret: ${JWT_SECRET:internal-service-super-secret-key-32chars-minimum-change-in-prod}

  # Security Configuration
security:
  enabled: ${SECURITY_ENABLED:false} # Disabled by default for development. Set SECURITY_ENABLED=true in production.

---
# Only load broker/topic Kafka settings when explicitly enabled (local laptop default: off)
spring:
  config:
    activate:
      on-property:
        name: MARKET_DATA_KAFKA_ENABLED
        having-value: "true"
    import:
      - classpath:application-kafka.yml
