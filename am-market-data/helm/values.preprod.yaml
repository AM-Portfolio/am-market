env:
  SPRING_PROFILES_ACTIVE: "preprod"
  JAVA_OPTS: "-Xms256m -Xmx512m -Dspring.profiles.active=preprod"
environment: preprod

replicaCount: 1

probes:
  port: 8080
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness

# Application Configuration
config:
  marketData:
    maxRetries: 3
    retryDelayMs: 1000
    threadPoolSize: 5
    threadQueueCapacity: 10
    maxAgeMinutes: 15

# Service Configuration
service:
  type: ClusterIP
  port: 8080

# Preprod app host only — am.asrax.in reserved for prod
ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-preprod-global-cors@kubernetescrd,
      am-apps-preprod-strip-prefix-apps@kubernetescrd
  hosts:
    - host: am-preprod.asrax.in
      paths:
        - path: /market
          pathType: Prefix

# Resource Configuration (reduced for Kind)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Vault — apps KV (same shape as prod; env segment = preprod)
vault:
  enabled: true
  secretPaths:
    postgres:
      path: "apps/data/preprod/infra/postgres"
    mongodb:
      path: "apps/data/preprod/infra/mongodb"
    redis:
      path: "apps/data/preprod/infra/redis"
    influxdb:
      path: "apps/data/preprod/infra/influxdb"
    kafka:
      path: "apps/data/preprod/infra/kafka"
    jwt:
      path: "apps/data/preprod/services/am-market-data"
    zerodha:
      path: "apps/data/preprod/services/am-market-data"
    upstox:
      path: "apps/data/preprod/services/am-market-data"

# Monitoring Configuration
monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: "8080"
    path: "/actuator/prometheus"
