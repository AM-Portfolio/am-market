vault:
  secretPaths:
    mongodb:
      mappings:
        MONGODB_URL: "url"
        SPRING_DATA_MONGODB_URI: "url"
    redis:
      mappings:
        REDIS_HOSTNAME: "host"
        REDIS_PASSWORD_INTERNAL: "password"
        REDIS_PORT: "port"
        SPRING_DATA_REDIS_HOST: "host"
        SPRING_DATA_REDIS_PASSWORD: "password"
        SPRING_DATA_REDIS_PORT: "port"
    influxdb:
      template: |
        export INFLUXDB_URL_INTERNAL="http://{{ .Data.data.host }}:{{ .Data.data.port }}"
        export INFLUXDB_TOKEN_INTERNAL="{{ .Data.data.token }}"
        export INFLUXDB_ORG_INTERNAL="{{ .Data.data.org }}"
        export INFLUXDB_BUCKET_INTERNAL="{{ .Data.data.bucket }}"
        export SPRING_INFLUX_URL="http://{{ .Data.data.host }}:{{ .Data.data.port }}"
        export SPRING_INFLUX_TOKEN="{{ .Data.data.token }}"
        export SPRING_INFLUX_ORG="{{ .Data.data.org }}"
        export SPRING_INFLUX_BUCKET="{{ .Data.data.bucket }}"
    jwt:
      mappings:
        JWT_SECRET: "JWT_SECRET_KEY"
        SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "JWT_SECRET_KEY"
    kafka:
      mappings:
        KAFKA_BOOTSTRAP_SERVERS: "bootstrap_servers"
        KAFKA_USERNAME: "username"
        KAFKA_PASSWORD: "password"
        SPRING_KAFKA_BOOTSTRAP_SERVERS: "bootstrap_servers"
        KAFKA_JAAS_CONFIG: "__jaas__"
        SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "__jaas__"
    upstox:
      mappings:
        UPSTOX_API_KEY: "UPSTOX_API_KEY"
        UPSTOX_SECRET_KEY: "UPSTOX_SECRET_KEY"
        UPSTOX_REDIRECT_URI: "UPSTOX_REDIRECT_URI"
        UPSTOX_ACCESS_TOKEN: "UPSTOCK_ACCESS_TOKEN"
    scheduler-config:
      mappings:
        SCHEDULER_TIMEZONE: "scheduler_timezone"
        SCHEDULER_COOKIE_ENABLED: "scheduler_cookie_enabled"
        SCHEDULER_COOKIE_REFRESH_CRON: "scheduler_cookie_refresh_cron"
        SCHEDULER_STOCK_INDICES_ENABLED: "scheduler_stock_indices_enabled"
        SCHEDULER_STOCK_INDICES_MORNING_FETCH_CRON: "scheduler_stock_indices_morning_fetch_cron"
        SCHEDULER_STOCK_INDICES_EVENING_FETCH_CRON: "scheduler_stock_indices_evening_fetch_cron"
        SCHEDULER_STOCK_INDICES_RETRY_CRON: "scheduler_stock_indices_retry_cron"
        SCHEDULER_STOCK_INDICES_RETRY_INTERVAL_MINUTES: "scheduler_stock_indices_retry_interval_minutes"
        SCHEDULER_STOCK_INDICES_RETRY_MAX_RETRIES: "scheduler_stock_indices_retry_max_retries"
        SCHEDULER_INDICES_FETCH_CRON: "scheduler_indices_fetch_cron"
        SCHEDULER_INGESTION_ENABLED: "scheduler_ingestion_enabled"
        SCHEDULER_INGESTION_PROVIDER: "scheduler_ingestion_provider"
        SCHEDULER_INGESTION_FORCE: "scheduler_ingestion_force"
        SCHEDULER_INGESTION_USE_WEBSOCKET: "scheduler_ingestion_use_websocket"
        SCHEDULER_INGESTION_POLL_ENABLED: "scheduler_ingestion_poll_enabled"
        SCHEDULER_INGESTION_POLL_HISTORICAL: "scheduler_ingestion_poll_historical"
        SCHEDULER_INGESTION_SYMBOLS: "scheduler_ingestion_symbols"
        SCHEDULER_INGESTION_START_CRON: "scheduler_ingestion_start_cron"
        SCHEDULER_INGESTION_STOP_CRON: "scheduler_ingestion_stop_cron"
        SCHEDULER_MARKET_START: "scheduler_market_start"
        SCHEDULER_MARKET_END: "scheduler_market_end"
        SCHEDULER_HISTORICAL_SYNC_CRON: "scheduler_historical_sync_cron"
        SCHEDULER_ANALYSIS_DAILY_CRON: "scheduler_analysis_daily_cron"
        SCHEDULER_STREAM_START_CRON: "scheduler_stream_start_cron"
        SCHEDULER_STREAM_STOP_CRON: "scheduler_stream_stop_cron"
        SCHEDULER_REDIS_CLEANUP_ENABLED: "scheduler_redis_cleanup_enabled"
        SCHEDULER_REDIS_CLEANUP_CRON: "scheduler_redis_cleanup_cron"
        REDIS_CLEANUP_RETENTION_DAYS: "redis_cleanup_retention_days"
        REDIS_CLEANUP_BATCH_SIZE: "redis_cleanup_batch_size"
        REDIS_CACHE_TTL_HISTORICAL: "redis_cache_ttl_historical"
        REDIS_CACHE_TTL_ANALYSIS: "redis_cache_ttl_analysis"
        REDIS_CACHE_TTL_INTRADAY_PAST: "redis_cache_ttl_intraday_past"
        REDIS_CACHE_TTL_INTRADAY_FUTURE: "redis_cache_ttl_intraday_future"
        REDIS_CACHE_TTL_INTRADAY_BUFFER: "redis_cache_ttl_intraday_buffer"
    postgres:
      mappings:
        POSTGRES_PASSWORD: "password"
        POSTGRES_USERNAME: "username"
        SPRING_DATASOURCE_PASSWORD: "password"
        SPRING_DATASOURCE_USERNAME: "username"
    identity-oidc:
      mappings:
        OIDC_JWKS_URI: "OIDC_JWKS_URL"
        OIDC_ISSUER_URI: "OIDC_ISSUER"
    service-oauth:
      mappings:
        OAUTH2_CLIENT_ID: "AM_MARKET_CLIENT_ID"
        OAUTH2_CLIENT_SECRET: "AM_MARKET_CLIENT_SECRET"

    otel:
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
    growthbook:
      mappings:
        GROWTHBOOK_CLIENT_KEY: "client_key"
        GROWTHBOOK_API_HOST: "api_host"
