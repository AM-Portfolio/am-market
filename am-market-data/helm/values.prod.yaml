# Production — am-market-data
# Service-level Ingress (same model as am-identity), not central am-infra ingress.

environment: prod
replicaCount: 1

env:
  SPRING_PROFILES_ACTIVE: "prod,security"
  JAVA_OPTS: "-Xms512m -Xmx1024m -Dspring.profiles.active=prod,security"

probes:
  port: 8080
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness

config:
  marketData:
    maxRetries: 3
    retryDelayMs: 1000
    threadPoolSize: 5
    threadQueueCapacity: 10
    maxAgeMinutes: 15
  batchSearch:
    cacheEnabled: true
    mongoQueryLimit: 0
    maxCandidatesPerQuery: 100
    internalBatchSize: 100

  # ── Prod scheduler — explicit for auditability ───────────────────────
  scheduler:
    cookie:
      enabled: false
      refreshCron: "0 0 9-16 * * MON-FRI"
    stockIndices:
      enabled: false
      morningFetchCron: "0 30 9 * * *"
      eveningFetchCron: "0 0 16 * * *"
      retry:
        cron: "0 */15 * * * *"
        intervalMinutes: 15
        maxRetries: 20
    indices:
      fetchCron: "0 */2 * * * *"
    ingestion:
      enabled: true
      provider: "UPSTOX"
      force: false
      useWebsocket: true
      pollEnabled: false
      pollHistorical: false
      symbols: "NIFTY 50,NIFTY BANK"
      startCron: "0 15 9 * * MON-FRI"
      stopCron: "0 30 15 * * MON-FRI"
    market:
      start: "09:15"
      end: "15:30"
    historical:
      syncCron: "0 15 7 * * *"
    analysis:
      dailyCron: "0 15 7 * * *"
    stream:
      startCron: "0 0 9 ? * MON-FRI"
      stopCron: "0 30 15 ? * MON-FRI"
    redisCleanup:
      enabled: true
      cron: "0 0 2 * * *"

  # ── Redis TTLs ────────────────────────────────────────────────
  redis:
    cleanupRetentionDays: 7
    cleanupBatchSize: 1000
    cacheTtl:
      historical: 2592000
      analysis: 2592000
      intradayPast: 14400
      intradayFuture: 86400
      intradayBuffer: 14400

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /market
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

postgresql:
  enabled: false

vault:
  enabled: true
  secretPaths:
    postgres:
      path: "apps/data/prod/infra/postgres"
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    redis:
      path: "apps/data/prod/infra/redis"
    influxdb:
      path: "apps/data/prod/infra/influxdb"
    kafka:
      path: "apps/data/prod/infra/kafka"
    jwt:
      path: "apps/data/prod/services/am-market-data"
    zerodha:
      path: "apps/data/prod/services/am-market-data"
    upstox:
      path: "apps/data/prod/services/am-market-data"
    market-data:
      path: "apps/data/prod/services/am-market-data"
    scheduler-config:
      path: "apps/data/prod/services/am-market-data-scheduler"
    identity-oidc:
      path: "apps/data/prod/services/am-identity"
    service-oauth:
      path: "apps/data/prod/services/am-market-data"

monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: "8080"
    path: "/actuator/prometheus"
