# Production — am-market-data
# Service-level Ingress (same model as am-identity), not central am-infra ingress.

environment: prod
replicaCount: 1

env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_OPTS: "-Xms512m -Xmx1024m -Dspring.profiles.active=prod"

probes:
  port: 8080
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness

config:
  marketData:
    maxRetries: 3
    retryDelayMs: 1000
    threadPoolSize: 5
    threadQueueCapacity: 10
    maxAgeMinutes: 15

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /market
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

postgresql:
  enabled: false

vault:
  enabled: true
  secretPaths:
    postgres:
      path: "apps/data/prod/infra/postgres"
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    redis:
      path: "apps/data/prod/infra/redis"
    influxdb:
      path: "apps/data/prod/infra/influxdb"
    kafka:
      path: "apps/data/prod/infra/kafka"
    jwt:
      path: "apps/data/prod/services/am-market-data"
    zerodha:
      path: "apps/data/prod/services/am-market-data"
    upstox:
      path: "apps/data/prod/services/am-market-data"

monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: "8080"
    path: "/actuator/prometheus"
