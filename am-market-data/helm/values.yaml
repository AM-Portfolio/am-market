replicaCount: 1
port: 8080
language: java

global:
  vault:
    serviceAccountName: "am-backend-sa"

image:
  repository: am-market-data
  pullPolicy: Always
  tag: "latest"

# Service-owned Ingress (same pattern as am-identity). Env values set hosts/paths.
ingress:
  enabled: false
  className: "traefik"
  hosts: []

security:
  automountServiceAccountToken: true

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

# Vault paths are set per-env in values.<env>.yaml (never hardcode one env here).
vault:
  enabled: true
  role: "am-backend-role"
  secretPaths: {}

# Application specific configuration
config:
  marketData:
    maxRetries: 5
    retryDelayMs: 2000
