env:
  SPRING_PROFILES_ACTIVE: "dev"
  JAVA_OPTS: "-Xms256m -Xmx512m -Dspring.profiles.active=dev"
environment: dev

probes:
  port: 8080

  startup:
    path: /actuator/health/liveness
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 18

  liveness:
    path: /actuator/health/liveness
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readiness:
    path: /actuator/health/readiness
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Application Configuration
config:
  marketData:
    maxRetries: 3
    retryDelayMs: 1000
    threadPoolSize: 5
    threadQueueCapacity: 10
    maxAgeMinutes: 15
  env: "dev"

# Service Configuration
service:
  type: ClusterIP
  port: 8080

# Ingress Configuration (disabled for Kind)
ingress:
  enabled: false
  ipAddress: 127.0.0.1

# Resource Configuration (reduced for local/Kind development)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Vault Configuration overrides for DEV
vault:
  enabled: true
  secretPaths:
    postgres:
      path: "apps/data/dev/infra/postgres"
    mongodb: 
      path: "apps/data/dev/infra/mongodb"
    redis: 
      path: "apps/data/dev/infra/redis"
    influxdb: 
      path: "apps/data/dev/infra/influxdb"
    jwt:
      path: "apps/data/dev/services/am-market-data"
    kafka: 
      path: "apps/data/dev/infra/kafka"
    zerodha:
      path: "apps/data/dev/services/am-market-data"
    upstox: 
      path: "apps/data/dev/services/am-market-data"

# Monitoring Configuration
monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: "8080"
    path: "/actuator/prometheus"
