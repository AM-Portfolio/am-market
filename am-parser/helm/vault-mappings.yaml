vault:
  secretPaths:
    auth:
      mappings:
        JWT_SECRET: "JWT_SECRET"
        INTERNAL_SECRET_KEY: "SECRET_KEY"
    market:
      mappings:
        MARKET_DATA_API_URL: "URL"
    mongodb:
      mappings:
        MONGO_URI: "url"
        MONGODB_DATABASE: "AM_PARSER_MONGO_DATABASE"
        MONGO_DB: "AM_PARSER_MONGO_DATABASE"
    together:
      mappings:
        TOGETHER_API_KEY: "TOGETHER_API_KEY"
    identity-oidc:
      mappings:
        OIDC_JWKS_URL: "OIDC_JWKS_URL"
        OIDC_ISSUER: "OIDC_ISSUER"
    service-oauth:
      mappings:
        OAUTH2_CLIENT_ID: "PARSER_CLIENT_ID"
        OAUTH2_CLIENT_SECRET: "PARSER_CLIENT_SECRET"

    otel:
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
