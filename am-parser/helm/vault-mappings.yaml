vault:
  secretPaths:
    auth:
      mappings:
        JWT_SECRET: "JWT_SECRET"
        INTERNAL_SECRET_KEY: "SECRET_KEY"
    market:
      mappings:
        MARKET_DATA_API_URL: "URL"
    # MF catalog Postgres (same infra secret as am-market-data); URL is non-secret in values.{env}.yaml
    postgres:
      mappings:
        AM_MARKET_MF_JDBC_USER: "username"
        AM_MARKET_MF_JDBC_PASSWORD: "password"
    mongodb:
      mappings:
        MONGO_URI: "url"
    together:
      mappings:
        TOGETHER_API_KEY: "TOGETHER_API_KEY"
    identity-oidc:
      mappings:
        OIDC_JWKS_URL: "OIDC_JWKS_URL"
        OIDC_ISSUER: "OIDC_ISSUER"
    service-oauth:
      mappings:
        OAUTH2_CLIENT_ID: "PARSER_CLIENT_ID"
        OAUTH2_CLIENT_SECRET: "PARSER_CLIENT_SECRET"

    otel:
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
