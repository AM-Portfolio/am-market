# Production — am-parser
# Service-level Ingress (same model as am-identity / am-market-data).

environment: prod
replicaCount: 1

env:
  ENVIRONMENT: "prod"
  MONGO_DB: "mutual_funds"

probes:
  port: 8080
  liveness:
    path: /health
  readiness:
    path: /health

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-prod-global-cors@kubernetescrd
  hosts:
    - host: am.asrax.in
      paths:
        - path: /parser
          pathType: Prefix

vault:
  enabled: true
  secretPaths:
    mongodb:
      path: "apps/data/prod/infra/mongodb"
    together:
      path: "apps/data/prod/infra/shared-api"
    identity:
      path: "apps/data/prod/services/am-identity"
    market:
      path: "apps/data/prod/services/am-market-data"
    oauth:
      path: "apps/data/prod/services/am-parser"
