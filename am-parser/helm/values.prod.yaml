environment: prod

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

# Vault Configuration (Prod Override)
vault:
  secretPaths:
    auth:
      path: apps/data/prod/services/am-auth
    logging:
      path: apps/data/prod/services/logging
    market:
      path: apps/data/prod/services/am-market-data
    mongodb: 
      path: "apps/data/prod/infra/mongodb"
    together:
      path: "apps/data/prod/infra/shared-api"

env:
  ENVIRONMENT: "prod"
  MONGO_DB: "mutual_funds"
  MARKET_DATA_URL: "http://am-market-data:8080"
  LOG_LEVEL: "INFO"
  ETF_LIST_CACHE_MINUTES: "60"
  ETF_HOLDINGS_CACHE_DAYS: "1"
