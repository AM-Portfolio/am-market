# Dev Environment — am-parser
environment: dev
replicaCount: 1

service:
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

vault:
  secretPaths:
    auth:
      path: apps/data/dev/services/am-auth
    logging:
      path: apps/data/dev/services/logging
    market:
      path: apps/data/dev/services/am-market-data
    mongodb: 
      path: "apps/data/dev/infra/mongodb"
    together:
      path: "apps/data/dev/infra/shared-api"
    # Add other secret paths as needed

hostAliases:
  - ip: "203.174.22.129"
    hostnames:
      - "redis.asrax.in"
      - "mongodb.asrax.in"
      - "kafka.asrax.in"

probes:
  port: 8080
  startup:
    path: "/health"
    timeoutSeconds: 10
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: "/health"
    timeoutSeconds: 10
  readiness:
    path: "/health"
    timeoutSeconds: 10

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-dev-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /market/parser
          pathType: Prefix

env:
  ENVIRONMENT: "dev"
  MONGO_DB: "mutual_funds"
  MARKET_DATA_URL: "http://am-market-data:8080"
  LOG_LEVEL: "INFO"
  ETF_LIST_CACHE_MINUTES: "60"
  ETF_HOLDINGS_CACHE_DAYS: "1"
