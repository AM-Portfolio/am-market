# Dev Environment — am-parser
environment: dev
replicaCount: 1

env:
  ENVIRONMENT: "dev"
  MONGO_DB: "mutual_funds"
  MARKET_DATA_URL: "http://am-market-data:8080"
  LOG_LEVEL: "INFO"
  ETF_LIST_CACHE_MINUTES: "60"
  ETF_HOLDINGS_CACHE_DAYS: "1"

probes:
  port: 8080
  startup:
    path: /health
    timeoutSeconds: 10
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    path: /health
    timeoutSeconds: 10
  readiness:
    path: /health
    timeoutSeconds: 10

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

service:
  type: ClusterIP
  port: 8080

# Matches live am-apps-dev ingress
ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-parser-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /parser
          pathType: Prefix
        - path: /market/parser
          pathType: Prefix

vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/dev/infra/observability"
    auth:
      path: apps/data/dev/services/am-auth
    logging:
      path: apps/data/dev/services/logging
    market:
      path: apps/data/dev/services/am-market-data
    mongodb:
      path: "apps/data/dev/infra/mongodb"
    together:
      path: "apps/data/dev/infra/shared-api"
    identity-oidc:
      path: "apps/data/dev/services/am-identity"
    service-oauth:
      path: "apps/data/dev/services/am-parser"

hostAliases:
  - ip: "203.174.22.129"
    hostnames:
      - "redis.asrax.in"
      - "mongodb.asrax.in"
      - "kafka.asrax.in"
