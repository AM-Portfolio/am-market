  name: am-parser-mf-catalog-nav-morning
  namespace: am-apps-prod
  labels:
    app.kubernetes.io/name: am-parser-mf-catalog-job
    app.kubernetes.io/part-of: am-parser
spec:
  schedule: "0 4 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 3600
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: am-parser-mf-catalog-job
        spec:
          serviceAccountName: am-backend-sa
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: catalog-nav
              # Same pin as evening — repin together after job image publish.
              image: ghcr.io/am-portfolio/am-market/am-parser-mf-catalog-job:2e30d03b6a52074e22b5e1f83406ccb6141fc397
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  if [ -z "$NSE_API_KEY" ] || [ -z "$AM_MARKET_MF_JDBC_PASSWORD" ]; then
                    echo "FAIL: NSE or JDBC secrets missing from synced Secrets"
                    exit 1
                  fi
                  # Morning: allow weekend lag (Fri NAV → Mon lag 2–3). Still CRIT-fail on empty/shrink.
                  exec python mf_catalog_job/daily_job.py --alert-if-nav-lag-days 3
              env:
                - name: TZ
                  value: Asia/Kolkata
                - name: AM_MARKET_MF_JDBC_URL
                  value: "jdbc:postgresql://postgres.asrax.in:5432/user_platform?currentSchema=mf_catalog"
                - name: MF_CATALOG_PUSH_CHUNK
