                - name: NSE_LOGIN
                  valueFrom:
                    secretKeyRef:
                      name: am-mutual-fund-synced-secrets
                      key: NSE_LOGIN
                - name: NSE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: am-mutual-fund-synced-secrets
                      key: NSE_API_KEY
                - name: NSE_API_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: am-mutual-fund-synced-secrets
                      key: NSE_API_SECRET
                - name: NSE_MEMBER
                  valueFrom:
                    secretKeyRef:
                      name: am-mutual-fund-synced-secrets
                      key: NSE_MEMBER
                - name: AM_MARKET_MF_JDBC_USER
                  valueFrom:
                    secretKeyRef:
                      name: am-parser-synced-secrets
                      key: AM_MARKET_MF_JDBC_USER
                - name: AM_MARKET_MF_JDBC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: am-parser-synced-secrets
                      key: AM_MARKET_MF_JDBC_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 1000
