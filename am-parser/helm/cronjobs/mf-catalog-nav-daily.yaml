# Dig CronJob: daily SCH/NAV ingest → Postgres mf_catalog (am-parser owns write).
# See am-parser/docs/mf-catalog-nav-ownership.md
# Secrets: Vault agent inject only — never plaintext NSE/JDBC passwords in git.
# NSE: temporarily from apps/dev/services/am-mutual-fund until duplicated under parser Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: am-parser-mf-catalog-job
  namespace: am-apps-dev
  labels:
    app.kubernetes.io/name: am-parser-mf-catalog-job
    app.kubernetes.io/part-of: am-parser
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: am-parser-mf-catalog-nav-daily
  namespace: am-apps-dev
  labels:
    app.kubernetes.io/name: am-parser-mf-catalog-job
    app.kubernetes.io/part-of: am-parser
spec:
  # 19:30 IST = 14:00 UTC (approx; IST no DST)
  schedule: "0 14 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  # Set false after first image publish + dig smoke; keep true until then to avoid empty runs.
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: am-parser-mf-catalog-job
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-init-first: "true"
            vault.hashicorp.com/auth-path: auth/jwt-nonprod
            vault.hashicorp.com/role: am-backend-role-dev
            # Temporary: NSE still lives under MF Vault path until duplicated for parser.
            vault.hashicorp.com/agent-inject-secret-nse: apps/dev/services/am-mutual-fund
            vault.hashicorp.com/agent-inject-template-nse: |
              {{- with secret "apps/dev/services/am-mutual-fund" -}}
              {{- with index .Data.data "nse_url" }}export NSE_URL="{{ . }}"{{ end }}
              {{- with index .Data.data "nse_login" }}
              export NSE_LOGIN="{{ . }}"{{ end }}
              {{- with index .Data.data "nse_api_key" }}
              export NSE_API_KEY="{{ . }}"{{ end }}
              {{- with index .Data.data "nse_api_secret" }}
              export NSE_API_SECRET="{{ . }}"{{ end }}
              {{- with index .Data.data "nse_member" }}
              export NSE_MEMBER="{{ . }}"{{ end }}
              {{- end }}
            vault.hashicorp.com/agent-inject-secret-jdbc: apps/dev/infra/postgres
            vault.hashicorp.com/agent-inject-template-jdbc: |
              {{- with secret "apps/dev/infra/postgres" -}}
              {{- with index .Data.data "username" }}
              export AM_MARKET_MF_JDBC_USER="{{ . }}"{{ end }}
              {{- with index .Data.data "password" }}
              export AM_MARKET_MF_JDBC_PASSWORD="{{ . }}"{{ end }}
              {{- end }}
        spec:
          serviceAccountName: am-parser-mf-catalog-job
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: catalog-nav
              image: ghcr.io/am-portfolio/am-market/am-parser-mf-catalog-job:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  . /vault/secrets/nse 2>/dev/null || true
                  . /vault/secrets/jdbc 2>/dev/null || true
                  if [ -z "$NSE_API_KEY" ] || [ -z "$AM_MARKET_MF_JDBC_PASSWORD" ]; then
                    echo "FAIL: Vault secrets not injected (NSE or JDBC)"
                    exit 1
                  fi
                  exec python mf_catalog_job/daily_job.py --fail-on-stale
              env:
                - name: TZ
                  value: Asia/Kolkata
                - name: AM_MARKET_MF_JDBC_URL
                  value: "jdbc:postgresql://postgres.asrax.in:5432/user_platform_dev?currentSchema=mf_catalog"
                - name: MF_CATALOG_PUSH_CHUNK
                  value: "100"
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 1000
---
