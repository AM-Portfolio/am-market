# Slim Contabo graph: Build once; Auto sync preprod on main only; Contabo Approve matrix.
name: Market Analytics Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "market-data-analysis-py/**"
      - ".github/workflows/market-analytics.yml"
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "market-data-analysis-py/**"
      - ".github/workflows/market-analytics.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish Analytics
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "market-data-analysis-py"
      image_name: "am-market-analysis"
    secrets: inherit
