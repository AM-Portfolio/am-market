# Slim Contabo graph: Build once; Auto sync preprod on main only; Contabo Approve matrix.
name: Market News Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "am-news/**"
      - ".github/workflows/market-news.yml"
  pull_request:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "am-news/**"
      - ".github/workflows/market-news.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish News
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "python"
      working_directory: "am-news"
      image_name: "am-news"
    secrets: inherit
