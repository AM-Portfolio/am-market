# Commit→SPT for am-market-data — NO GitHub Actions runner executes SPT.
#
# Preferred: GitHub webhook on dig qa-agent
#   POST /qa/webhooks/github (push) → CommitSptWorkflow on Temporal
#   Worker pod runs k6 + email/Cliq.
#
# Optional fallback (fire-and-forget Temporal start only):
#   uses am-qa-agents spt-on-commit.yml which POSTs /v2/workflows/commit-spt
#   then exits. Still needs a runner for the POST; prefer webhook.

name: QA Agent SPT Notify

on:
  push:
    branches: ["main", "develop", "dev", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "am-market-data/**"
      - ".github/workflows/qa-agent-spt-notify.yml"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Override branch for matrix
        required: false
        type: string
        default: ""

concurrency:
  group: qa-agent-spt-notify-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  start-temporal:
    name: Start CommitSpt (Temporal / qa-agent pod)
    # Fire-and-forget only. Disable if GitHub→qa-agent webhook is configured.
    if: ${{ vars.SPT_USE_GHA_START != 'false' }}
    uses: AM-Portfolio/am-qa-agents/.github/workflows/spt-on-commit.yml@feature/design-with-skills
    with:
      service: am-market-data
      git_ref: ${{ github.event.inputs.git_ref || github.ref_name }}
      git_sha: ${{ github.sha }}
      committer_email: ${{ github.event.head_commit.author.email || github.event.pusher.email || '' }}
      committer_name: ${{ github.event.head_commit.author.name || github.actor || '' }}
      environment: dev
      qa_base_url: https://am-dev.asrax.in/qa
      repo: ${{ github.repository }}
    secrets: inherit
