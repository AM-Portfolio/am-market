name: Market Data Publish

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop", "dev", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "am-market-data/**"
      - "am-common-investment-data/**"
      - ".github/workflows/market-data.yml"
  pull_request:
    branches: ["main", "develop", "dev", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "am-market-data/**"
      - "am-common-investment-data/**"

jobs:
  publish:
    name: Build, Publish and Deploy to Dev
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: "java"
      working_directory: "am-market-data"
      image_name: "am-market-data"
      build_context: ".."
      preprod_namespace: "am-apps-preprod"
      prod_namespace: "am-apps-prod"
      dev_namespace: "am-apps-dev"
      contabo_approve: true
    secrets: inherit
