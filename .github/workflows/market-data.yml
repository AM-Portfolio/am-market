# Slim Contabo graph: Build once; Auto sync preprod on main only; Contabo Approve matrix.
name: Market Data Publish

on:
  push:
    branches: ["main", "develop", "dev", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "am-market-data/**"
      - "am-common-investment-data/**"
      - ".github/workflows/market-data.yml"
  pull_request:
    branches: ["main", "develop", "dev", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "am-market-data/**"
      - "am-common-investment-data/**"
      - ".github/workflows/market-data.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish Market Data
    permissions:
      contents: write
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish-contabo.yml@main
    with:
      language: "java"
      working_directory: "am-market-data"
      image_name: "am-market-data"
      build_context: ".."
    secrets: inherit
